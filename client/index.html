<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoP - Protocol</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏓</text></svg>">
<style>
  :root{
    --c1:#ff6b6b; --c2:#feca57; --c3:#48dbfb; --c4:#1dd1a1; --c5:#a55eea; --c6:#ff9ff3;
    --ink:#3b3552;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ overflow-x:hidden; }
  body{
    font-family:'Comic Sans MS','Chalkboard SE','Segoe Print','Marker Felt',cursive,sans-serif;
    color:var(--ink); min-height:100vh;
    background:
      radial-gradient(1200px 600px at 20% -10%, #fff3c4 0%, transparent 60%),
      radial-gradient(1000px 500px at 90% 0%, #d6f0ff 0%, transparent 55%),
      radial-gradient(900px 700px at 50% 110%, #ffe3f1 0%, transparent 60%),
      #fdf6ec;
    display:flex; flex-direction:column; align-items:center;
    padding:14px; gap:8px;
  }
  h1{
    font-size:clamp(30px,5vw,46px); letter-spacing:2px;
    background:linear-gradient(90deg,var(--c1),var(--c2),var(--c4),var(--c3),var(--c5));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:wob 3.2s ease-in-out infinite;
  }
  @keyframes wob{ 0%,100%{ transform:rotate(-1.2deg) scale(1);} 50%{ transform:rotate(1.2deg) scale(1.03);} }
  #conn{ font-size:13px; font-weight:bold; opacity:.8; }
  #conn.ok{ color:#10ac84; } #conn.err{ color:#e0181d; }
  #wrap{
    position:relative; width:min(960px,96vw);
    background:#fffdf7; border:3px solid #2f2b44; border-radius:22px;
    box-shadow:0 10px 0 rgba(47,43,68,.25), 0 24px 40px rgba(47,43,68,.18);
    padding:10px 12px 14px;
  }
  #canvas-holder{ width:100%; display:flex; justify-content:center; }
  #canvas-holder canvas{ border:2px solid #2f2b44; border-radius:14px; background:linear-gradient(#f7f3ff,#fff6fa); touch-action:none; }
  .screen{ display:none; padding:10px 4px; }
  .muted{ opacity:.6; font-size:13px; }
  button{
    font:inherit; font-weight:bold; font-size:15px; cursor:pointer;
    background:var(--c2); border:2px solid #2f2b44; border-radius:14px;
    padding:5px 14px; box-shadow:0 3px 0 rgba(47,43,68,.3);
    transition:transform .08s; user-select:none;
  }
  button:active{ transform:translateY(3px); box-shadow:none; }
  button.small{ font-size:12px; padding:2px 8px; margin-left:6px; }
  input{
    font:inherit; font-size:15px; padding:5px 10px; margin:2px 4px;
    border:2px solid #2f2b44; border-radius:12px; background:#fff; width:180px;
  }
  .menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .menu-card{ background:rgba(255,255,255,.92); border:3px solid #2f2b44; border-radius:20px;
    padding:14px 16px; box-shadow:0 4px 0 rgba(47,43,68,.18); display:flex; flex-direction:column; gap:8px; }
  .menu-card h3{ font-size:1.05rem; margin-bottom:2px; }
  .card-create h3{ color:#e84393; } .card-join h3{ color:#4a69bd; }
  .card-rooms h3{ color:#10ac84; } .card-top h3{ color:#ee7724; }
  .menu-card input, .menu-card select{ width:100%; font:inherit; padding:8px 10px;
    border:2px solid #2f2b44; border-radius:12px; background:#fff; }
  .menu-card button{ font:inherit; padding:9px 14px; border:3px solid #2f2b44; border-radius:14px;
    background:var(--c2,#feca57); cursor:pointer; box-shadow:0 3px 0 rgba(47,43,68,.25); transition:transform .12s; }
  .menu-card button:hover{ transform:translateY(-2px); }
  .menu-card button.primary{ background:linear-gradient(135deg,#feca57,#ff9ff3); font-weight:bold; }
  .join-row{ display:flex; gap:8px; } .join-row .code-input{ width:110px; text-transform:uppercase; letter-spacing:2px; text-align:center; }
  .card-hint{ font-size:.8rem; color:#8a839e; }
  .rooms-head{ display:flex; align-items:center; justify-content:space-between; }
  .card-top button{ align-self:flex-start; }
  .card-rooms #rooms{ max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:5px; }
  @media (max-width:720px){ .menu-grid{ grid-template-columns:1fr; } }
  #color-palette{ display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 10px; }
  .color-dot{ width:22px; height:22px; border-radius:50%; cursor:pointer;
    border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .12s; }
  .color-dot:hover{ transform:scale(1.18); }
  .color-dot.chosen{ border-color:var(--ink); transform:scale(1.22); box-shadow:0 0 0 3px rgba(59,53,82,.2); }
  .room-row,.player-row{ padding:6px 10px; border:2px solid #2f2b44; border-radius:12px; background:#fff; margin:5px 0; display:flex; align-items:center; gap:8px; box-shadow:0 2px 0 rgba(47,43,68,.15); }
  .room-row{ justify-content:space-between; }
  .dot{ width:14px; height:14px; border-radius:50%; border:2px solid #2f2b44; display:inline-block; }
  #hud{ display:flex; gap:8px; flex-wrap:wrap; margin:6px 0; min-height:30px; }
  .pill{ background:#fff; border:2px solid #2f2b44; border-radius:12px; padding:2px 10px; font-size:14px; font-weight:bold; box-shadow:0 2px 0 rgba(47,43,68,.2); }
  .combo{ color:#e0181d; }
  #chat{ height:110px; overflow-y:auto; border:2px solid #2f2b44; border-radius:12px; background:#fff; padding:6px 10px; font-size:14px; margin:6px 0; }
  #over{ display:none; position:absolute; inset:0; background:rgba(255,253,247,.94); border-radius:22px; z-index:5; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:18px; text-align:center; }
  #over h2{ font-size:34px; }
  #toasts{ position:fixed; top:12px; right:12px; z-index:9; display:flex; flex-direction:column; gap:6px; }
  #toasts div{ background:#2f2b44; color:#fff; padding:6px 14px; border-radius:12px; font-size:14px; animation:popin .25s ease; }
  @keyframes popin{ 0%{ transform:scale(1.4);} 100%{ transform:scale(1);} }
  .hint{ text-align:center; font-size:12px; opacity:.6; margin-top:8px; }
  #over{ animation: overIn .5s cubic-bezier(.2,1.4,.4,1) both; border:4px solid #2f2b44;
    border-radius:22px; background:rgba(255,255,255,.94); box-shadow:0 8px 0 rgba(47,43,68,.2); }
  @keyframes overIn { 0%{ transform:scale(.6) rotate(-3deg); opacity:0; } 100%{ transform:scale(1) rotate(0); opacity:1; } }
  .screen{ animation: screenIn .35s ease both; }
  @keyframes screenIn { 0%{ opacity:0; transform:translateY(10px); } 100%{ opacity:1; transform:none; } }
  #loading-screen{ position:fixed; inset:0; z-index:60; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:26px;
    background:linear-gradient(160deg,#fff4ec 0%,#ffe6f0 45%,#e3f4ff 100%); transition:opacity .4s; }
  #loading-screen.hidden{ opacity:0; pointer-events:none; }
  .loading-logo{ font-size:2rem; font-weight:bold; background:linear-gradient(90deg,#ff6b6b,#feca57,#1dd1a1,#a55eea);
    -webkit-background-clip:text; background-clip:text; color:transparent; animation:hueShift 3s linear infinite; }
  @keyframes hueShift { 0%{ filter:hue-rotate(0); } 100%{ filter:hue-rotate(360deg); } }
  .loading-scene{ position:relative; display:flex; align-items:flex-end; justify-content:center; gap:70px; height:70px; width:280px; }
  .loading-paddle{ width:90px; height:14px; border-radius:8px; background:linear-gradient(135deg,#ff6b6b,#ee5253);
    box-shadow:0 3px 0 rgba(47,43,68,.2); animation:pslide 1.8s ease-in-out infinite alternate; }
  .loading-paddle.right{ background:linear-gradient(135deg,#48dbfb,#0abde3); animation-delay:.9s; }
  @keyframes pslide { 0%{ transform:translateX(-26px); } 100%{ transform:translateX(26px); } }
  .loading-ball{ width:22px; height:22px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff,#feca57 55%,#ff9ff3);
    box-shadow:0 0 14px rgba(255,159,243,.7); position:absolute; bottom:36px; left:50%; margin-left:-11px;
    animation:lbounce .75s cubic-bezier(.35,0,.65,1) infinite alternate; }
  @keyframes lbounce { 0%{ transform:translateY(-26px) scale(1,1); } 100%{ transform:translateY(24px) scale(1.1,.85); } }
  .loading-text{ font-size:1.05rem; color:#3b3552; }
  .dots span{ animation:dotPulse 1.2s infinite; opacity:0; }
  .dots span:nth-child(2){ animation-delay:.2s; } .dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes dotPulse { 0%,100%{ opacity:0; } 50%{ opacity:1; } }
  .ult-row{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .ult-label{ font-size:.9rem; color:#3b3552; }
  .ult-btn{ font-size:.85rem; padding:4px 10px; border-radius:12px; background:#fff; border:2px solid #cfc6e8; cursor:pointer; }
  .ult-btn.active{ background:#ffe6f0; border-color:#ff6b6b; font-weight:bold; }
  .card-editor{ background:linear-gradient(135deg,#e8f4ff,#e3f4ff); }
  .maps-list{ max-height:180px; overflow:auto; margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .map-row{ display:flex; gap:8px; align-items:center; background:#fff; border:2px solid #cfc6e8; border-radius:12px; padding:5px 8px; font-size:.9rem; }
  .map-row b{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ed-head{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  #ed-name{ padding:6px 10px; border-radius:10px; border:2px solid #cfc6e8; width:200px; }
  .ed-rows-lab{ font-size:.9rem; color:#3b3552; }
  .ed-palette{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .ed-tool{ width:38px; height:38px; border-radius:10px; border:2.5px solid #2f2b44; font-weight:bold; cursor:pointer; font-size:1rem; }
  .ed-tool.active{ outline:3px solid #ff6b6b; }
  .ed-grid{ display:grid; grid-template-columns:repeat(10, 1fr); gap:3px; max-width:640px; margin:0 auto; }
  .ed-cell{ aspect-ratio:1; border-radius:6px; border:2px solid #cfc6e8; background:#fff; cursor:pointer; min-width:34px; }
  @media (max-width: 720px) {
    h1 { font-size: 1.6rem; }
    .menu-row { flex-wrap: wrap; }
    #hud { flex-wrap: wrap; gap: 4px; font-size: 0.85rem; }
    .pill { padding: 3px 8px; }
    #room-buttons button, #bot-buttons button { padding: 8px 12px; font-size: 1rem; }
    #color-palette .color-dot { width: 26px; height: 26px; }
    body { padding: 8px; }
    #canvas-holder { margin: 4px 0; }
  }
</style>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-logo">PoP - Protocol</div>
    <div class="loading-scene">
      <div class="loading-paddle left"></div>
      <div class="loading-ball"></div>
      <div class="loading-paddle right"></div>
    </div>
    <div class="loading-text" id="loading-text">Подключение<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
  </div>
  <h1>PoP - Protocol</h1>
  <div style="display:flex; gap:8px; align-items:center;">
    <div id="conn">подключение…</div>
    <button id="btn-lang" class="small">EN</button>
    <button id="btn-sound" class="small">🔊</button>
    <button id="btn-exit" class="small" data-i18n="exitMenu">Выйти в меню</button>
  </div>

  <div id="wrap">
    <!-- МЕНЮ -->
    <div id="screen-menu" class="screen">
      <div class="menu-grid">
        <section class="menu-card card-create">
          <h3 data-i18n="secCreate">🏠 Создать комнату</h3>
          <input id="room-name" data-i18n-ph="roomName" maxlength="32">
          <input id="room-pass" data-i18n-ph="roomPass" maxlength="32">
          <select id="room-mode">
            <option value="0">Кооп</option>
            <option value="1">Босс-раш</option>
            <option value="2">Волна</option>
          </select>
          <button id="btn-create" class="primary" data-i18n="create">Создать</button>
        </section>
        <section class="menu-card card-join">
          <h3 data-i18n="secJoin">🚪 Войти по коду</h3>
          <div class="join-row">
            <input id="join-code" data-i18n-ph="joinCode" maxlength="6" class="code-input">
            <input id="join-pass" data-i18n-ph="joinPass" maxlength="32">
          </div>
          <button id="btn-join-code" class="primary" data-i18n="joinByCode">Войти по коду</button>
          <div class="card-hint" data-i18n="joinHint">код скажет друг, который создал комнату</div>
        </section>
      </div>
      <section class="menu-card card-rooms">
        <div class="rooms-head">
          <h3 data-i18n="secRooms">📋 Открытые комнаты</h3>
          <button id="btn-refresh" class="small" data-i18n="refresh">↻ обновить</button>
        </div>
        <div id="rooms"></div>
      </section>
          <section class="menu-card card-editor">
      <h3>🎨 Редактор карт</h3>
      <button id="btn-editor" class="primary" data-i18n="edOpen">Открыть редактор</button>
      <div id="maps-list" class="maps-list"></div>
    </section>
<section class="menu-card card-top">
        <h3 data-i18n="secTop">🏆 Зал славы</h3>
        <div id="top-list" class="muted" data-i18n="topEmpty">сыграйте матч — и вы здесь</div>
        <button id="btn-leaderboard" class="small" data-i18n="refreshTop">↻ обновить топ</button>
      </section>
    </div>

    <!-- КОМНАТА -->
    <div id="screen-room" class="screen">
      <div class="menu-row"><b id="room-title"></b><span style="flex:1"></span>
        <button id="btn-join-play" style="display:none" data-i18n="becomePlayer">Стать игроком</button>
        <div class="ult-row" id="ult-row">
          <span class="ult-label" data-i18n="ultPick">Ульта:</span>
          <button class="ult-btn" data-ult="0" data-i18n="ultNone">Нет</button>
          <button class="ult-btn" data-ult="1" data-i18n="ultIce">❄ Лед</button>
          <button class="ult-btn" data-ult="2" data-i18n="ultMeteor">☄ Метеорит</button>
          <button class="ult-btn" data-ult="3" data-i18n="ultMagnet">🧲 Магнит</button>
        </div>
      <button id="btn-ready" data-i18n="ready">Готов</button>
        <button id="btn-start" style="display:none" data-i18n="start">▶ Старт</button>
        <button id="btn-leave" data-i18n="leave">Выйти</button>
      </div>
      <div class="menu-row" id="bot-buttons" style="display:none">
        <span class="muted" data-i18n="bots">Боты:</span>
        <button id="btn-bot-lazy" class="small">+ Лентяй</button>
        <button id="btn-bot-normal" class="small">+ Обычный</button>
        <button id="btn-bot-pro" class="small">+ Профи</button>
      </div>
      <div id="color-palette" title="цвет ракетки"></div>
      <div id="room-players"></div>
      <div id="chat"></div>
      <div class="menu-row">
        <input id="chat-input" placeholder="сообщение…" maxlength="120" style="flex:1; width:auto">
        <button id="btn-chat">></button>
      </div>
    </div>

    <!-- МАТЧ -->
    <div id="screen-editor" class="screen" style="display:none">
      <div class="ed-head">
        <input id="ed-name" maxlength="24" placeholder="Название карты" data-i18n-ph="edName">
        <span class="ed-rows-lab" data-i18n="edRows">Строк:</span>
        <button id="ed-rows-minus" class="small">−</button>
        <span id="ed-rows-n">5</span>
        <button id="ed-rows-plus" class="small">+</button>
        <button id="ed-clear" class="small" data-i18n="edClear">Очистить</button>
        <button id="ed-test" class="primary" data-i18n="edTest">▶ Тест</button>
        <button id="ed-publish" class="primary" data-i18n="edPublish">🌍 Опубликовать</button>
        <button id="ed-close" class="small" data-i18n="edClose">← Меню</button>
      </div>
      <div class="ed-palette" id="ed-palette"></div>
      <div id="ed-grid" class="ed-grid"></div>
    </div>
    <div id="screen-game" class="screen">
      <div id="hud"></div>
      <div id="canvas-holder"></div>
      <div class="hint" data-i18n="hint">мышь — ракетка · клик/пробел — запуск · 1–8 — эмоции</div>
    </div>

    <div id="over"></div>
  </div>

  <div id="toasts"></div>

  <script src="/pixi.min.js"></script>
  <script>window.PIXI||document.write('<scr'+'ipt src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"><\/scr'+'ipt>');</script>
  <script src="/proto.js"></script>
  <script src="/app.js"></script>
</body>
</html>
