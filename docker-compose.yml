services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping: 1})"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: .
    image: popproto
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MONGO_URL: mongodb://mongo:27017
      RUST_LOG: info
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
